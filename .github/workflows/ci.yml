name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (CPU torch)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[ref,dev]"
      # tokenizer round-trip + exact tiktoken match, shape/causality/KV-cache/overfit tests,
      # and reference matching (HF GPT-2, timm ViT, HF CLIP) on tiny random configs
      - run: pytest -q
